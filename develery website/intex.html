<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Cravely — Food, delivered with joy</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fffaf4; color: #242321; font-family: Arial, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .topline { padding: 9px; background: #242321; color: white; text-align: center; font-size: 12px; }
    .topline b { color: #ffc27a; }
    header { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; padding: 18px 7%; background: white; border-bottom: 1px solid #eee9e2; }
    .brand { font-size: 25px; font-weight: 800; cursor: pointer; }
    .brand span { color: #ff6b35; }
    .nav-buttons { display: flex; align-items: center; gap: 12px; }
    .nav-buttons button, .pill { padding: 11px 15px; border: 1px solid #eee9e2; border-radius: 24px; background: white; font-weight: 700; }
    .nav-buttons .dark { background: #242321; color: white; }
    .hero { max-width: 1180px; min-height: 350px; margin: 24px auto; padding: 55px 7%; border-radius: 25px; display: flex; align-items: center; justify-content: space-between; background: linear-gradient(110deg,#ffe2c9,#ffc398); overflow: hidden; }
    .hero h1 { margin: 10px 0; font: 800 clamp(42px,6vw,68px)/1.02 Georgia,serif; }
    .hero h1 span { color: #ff6b35; }
    .hero p { max-width: 430px; color: #66564d; line-height: 1.7; }
    .hero-art { width: 260px; height: 230px; object-fit: cover; border-radius: 50%; box-shadow: 0 20px 40px #81452233; }
    .cta { padding: 14px 20px; border: 0; border-radius: 10px; background: #ff6b35; color: white; font-weight: 800; }
    main { max-width: 1180px; margin: auto; padding: 0 24px; }
    .section { padding: 28px 0; }
    h2 { font: 700 29px Georgia,serif; }
    .muted { color: #85827d; }
    .categories { display: flex; gap: 10px; overflow: auto; padding: 5px 0 18px; }
    .category { padding: 11px 17px; border: 1px solid #eee9e2; border-radius: 24px; background: white; white-space: nowrap; }
    .category.active { background: #242321; color: white; }
    .search { width: min(520px,100%); margin: 12px 0 22px; padding: 14px; border: 1px solid #eee9e2; border-radius: 12px; }
    .grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; }
    .card { overflow: hidden; border: 1px solid #eee9e2; border-radius: 17px; background: white; cursor: pointer; transition: .2s; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 18px 45px #33200f14; }
    .card-image { position: relative; height: 190px; background: #f5e5d3; }
    .card-image img { width: 100%; height: 100%; object-fit: cover; }
    .badge { position: absolute; top: 12px; left: 12px; padding: 7px 10px; border-radius: 20px; background: white; font-size: 10px; font-weight: 800; }
    .heart { position: absolute; top: 10px; right: 10px; border: 0; border-radius: 50%; background: white; width: 34px; height: 34px; font-size: 18px; }
    .card-body { padding: 15px; }
    .card-title { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card-title h3 { margin: 0; font-size: 16px; }
    .rating { padding: 5px 7px; border-radius: 7px; background: #23865b; color: white; font-size: 11px; }
    .card-body p { color: #85827d; font-size: 13px; }
    .banner { margin: 35px 0; padding: 26px; border-radius: 18px; background: #23372e; color: white; display: flex; justify-content: space-between; align-items: center; }
    .banner p { color: #d1ddd6; }
    .page { max-width: 900px; margin: 30px auto; padding: 0 24px; }
    .back { margin-bottom: 20px; border: 0; background: none; color: #706a63; font-weight: 700; }
    .panel { margin: 15px 0; padding: 22px; border: 1px solid #eee9e2; border-radius: 16px; background: white; }
    .restaurant-head { display: flex; align-items: center; gap: 20px; }
    .restaurant-head img { width: 140px; height: 120px; border-radius: 15px; object-fit: cover; }
    .menu-row, .cart-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 17px 0; border-bottom: 1px dashed #ddd; }
    .menu-row p { color: #85827d; font-size: 13px; }
    .add { padding: 9px 16px; border: 1px solid #ddd; border-radius: 8px; background: white; color: #23865b; font-weight: 800; }
    .qty button { border: 0; background: white; color: #23865b; padding: 7px 10px; font-weight: 800; }
    .qty { border: 1px solid #ddd; border-radius: 8px; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; color: #635f59; }
    .total { border-top: 1px dashed #ddd; margin-top: 10px; padding-top: 14px; font-weight: 800; color: #242321; }
    .field { display: block; margin: 13px 0; font-weight: 700; font-size: 13px; }
    .field input { display: block; width: 100%; margin-top: 7px; padding: 13px; border: 1px solid #ddd; border-radius: 9px; }
    .full { width: 100%; margin-top: 12px; }
    .success { padding: 55px 20px; text-align: center; }
    footer { margin-top: 45px; padding: 27px; background: #242321; color: #aaa; text-align: center; font-size: 13px; }
    .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 25px; background: #242321; color: white; opacity: 0; transition: .2s; z-index: 10; }
    .toast.show { opacity: 1; }
    @media(max-width:750px) { .hero { margin: 15px; min-height: 300px; } .hero-art { width: 150px; height: 150px; } .grid { grid-template-columns: repeat(2,1fr); } header { padding: 15px; } }
    @media(max-width:500px) { .hero-art { display: none; } .grid { grid-template-columns: 1fr; } .banner { display: block; } .restaurant-head img { width: 90px; height: 90px; } }
/* Scroll Animation */

.scroll-reveal {
    opacity: 0;
    transform: translateY(70px);
    transition: opacity 1s ease, transform 1s ease;
}

.scroll-reveal.show {
    opacity: 1;
    transform: translateY(0);
}
.food-pop {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    font-size: 28px;
    animation: foodFloat 1s ease-out forwards;
}

@keyframes foodFloat {
    0% {
        opacity: 1;
        transform: translateY(0) scale(0.5) rotate(0deg);
    }

    100% {
        opacity: 0;
        transform: translateY(-100px) scale(1.5) rotate(40deg);
    }
}
/* Mouse follower */
.mouse-glow {
    position: fixed;
    width: 25px;
    height: 25px;
    border: 2px solid #ff6b35;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 15px #ff6b35;
    transition: width 0.2s, height 0.2s;
}

/* Mouse trail */
.mouse-dot {
    position: fixed;
    width: 7px;
    height: 7px;
    background: #ff6b35;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99998;
    transform: translate(-50%, -50%);
}
/* Welcome Screen */
.welcome-screen {
    position: fixed;
    inset: 0;
    z-index: 100000;
    background: linear-gradient(135deg, #160d09, #3b160b, #120b08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 20px;
    animation: welcomeFade 1s ease;
}

.welcome-screen h1 {
    font-size: clamp(38px, 8vw, 65px);
    color: #ff762e;
    margin: 15px;
    letter-spacing: 3px;
}

.welcome-screen p {
    font-size: 19px;
    color: #eee;
}

.welcome-emoji {
    font-size: 65px;
    animation: foodBounce 2s infinite;
}

.welcome-btn {
    margin-top: 30px;
    padding: 15px 38px;
    border: none;
    border-radius: 35px;
    background: linear-gradient(45deg, #ff512f, #ff9900);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 25px #ff762e;
    transition: 0.3s;
}

.welcome-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 35px #ff762e;
}

@keyframes foodBounce {
    50% { transform: translateY(-15px) rotate(10deg); }
}

@keyframes welcomeFade {
    from { opacity: 0; }
    to { opacity: 1; }
}

.welcome-screen.hide {
    opacity: 0;
    visibility: hidden;
    transition: 0.7s;
}
/* Circular Food Animation */
.food-orbit {
    position: fixed;
    top: 50%;
    right: 65px;
    width: 180px;
    height: 180px;
    transform: translateY(-50%);
    border: 2px dashed #ff762e;
    border-radius: 50%;
    animation: orbitRotate 12s linear infinite;
    z-index: 1000;
    pointer-events: none;
}

.food-orbit span {
    position: absolute;
    font-size: 35px;
    animation: orbitReverse 12s linear infinite;
}

.food-orbit span:nth-child(1) {
    top: -20px;
    left: 70px;
}

.food-orbit span:nth-child(2) {
    top: 45px;
    right: -20px;
}

.food-orbit span:nth-child(3) {
    bottom: -20px;
    left: 70px;
}

.food-orbit span:nth-child(4) {
    top: 45px;
    left: -20px;
}

@keyframes orbitRotate {
    to { transform: translateY(-50%) rotate(360deg); }
}

@keyframes orbitReverse {
    to { transform: rotate(-360deg); }
}

@media(max-width: 600px) {
    .food-orbit {
        width: 120px;
        height: 120px;
        right: 15px;
        opacity: 0.7;
    }

    .food-orbit span {
        font-size: 25px;
    }
}
/* ===== CRAVELY PREMIUM ANIMATION ===== */

#app .hero {
    position: relative;
    overflow: hidden;
    isolation: isolate;
}

/* Moving orange light waves */
#app .hero::before,
#app .hero::after {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    filter: blur(65px);
    opacity: 0.28;
    pointer-events: none;
    z-index: -1;
}

#app .hero::before {
    background: #ff6b35;
    top: -180px;
    right: -100px;
    animation: orangeWave 8s ease-in-out infinite alternate;
}

#app .hero::after {
    background: #ffb36b;
    bottom: -220px;
    left: 25%;
    animation: orangeWave 10s ease-in-out infinite alternate-reverse;
}

@keyframes orangeWave {
    from {
        transform: translate(0, 0) scale(0.8);
    }
    to {
        transform: translate(-100px, 80px) scale(1.3);
    }
}

/* Heading reveal */
#app .hero h1 {
    animation: headingReveal 1.2s ease both;
}

@keyframes headingReveal {
    from {
        opacity: 0;
        transform: translateY(45px);
        filter: blur(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

/* Food image 3D floating */
#app .hero img {
    animation: food3D 5s ease-in-out infinite;
    transform-style: preserve-3d;
    transition: transform 0.5s ease;
}

#app .hero img:hover {
    transform: perspective(700px) rotateY(15deg) rotateX(8deg) scale(1.08);
}

@keyframes food3D {
    0%, 100% {
        transform: perspective(700px) translateY(0) rotateY(-5deg);
    }
    50% {
        transform: perspective(700px) translateY(-15px) rotateY(5deg);
    }
}

/* Floating food emojis */
.cravely-floating-food {
    position: absolute;
    z-index: 5;
    pointer-events: none;
    font-size: 30px;
    animation: foodFloat 6s ease-in-out infinite;
}

@keyframes foodFloat {
    0%, 100% {
        transform: translateY(0) rotate(-10deg);
    }
    50% {
        transform: translateY(-35px) rotate(15deg);
    }
}

/* Moving particles */
.cravely-particle {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff6b35;
    opacity: 0.7;
    pointer-events: none;
    animation: particleMove 7s linear infinite;
}

@keyframes particleMove {
    0% {
        transform: translateY(100px) scale(0);
        opacity: 0;
    }
    50% {
        opacity: 0.8;
    }
    100% {
        transform: translateY(-250px) scale(1.5);
        opacity: 0;
    }
}

@media (prefers-reduced-motion: reduce) {
    #app .hero *,
    #app .hero::before,
    #app .hero::after {
        animation: none !important;
    }
}
/* CRAVELY FLOATING FOOD BACKGROUND */

.food-dancer {
    position: fixed;
    z-index: 0;
    pointer-events: none;
    font-size: 55px;
    opacity: 0.35;
    animation: foodDance 6s ease-in-out infinite;
}

@keyframes foodDance {
    0%, 100% {
        transform: translateY(0) rotate(-15deg) scale(1);
    }

    25% {
        transform: translateY(-35px) rotate(15deg) scale(1.15);
    }

    50% {
        transform: translateY(15px) rotate(35deg) scale(0.95);
    }

    75% {
        transform: translateY(-25px) rotate(-10deg) scale(1.1);
    }
}

/* ===== CRAVELY ULTRA EXPERIENCE ===== */

html {
    scroll-behavior: smooth;
}

body {
    background:
        radial-gradient(circle at 10% 20%, #FFE2D6 0%, transparent 30%),
        radial-gradient(circle at 90% 80%, #D9F5E9 0%, transparent 30%),
        #FFFDF8;
}

/* Animated hero background */
#app .hero {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background: linear-gradient(
        120deg,
        #102B46,
        #176B78,
        #FF684A,
        #FFB36B
    );
    background-size: 300% 300%;
    animation: cravelyColorFlow 12s ease infinite;
    box-shadow: 0 20px 60px #17324D25;
}

@keyframes cravelyColorFlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Soft glowing light */
#app .hero::before {
    content: "";
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: #FFFFFF35;
    filter: blur(80px);
    top: -120px;
    left: 35%;
    animation: lightMove 8s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: -1;
}

@keyframes lightMove {
    from { transform: translate(-100px, 0) scale(0.8); }
    to { transform: translate(180px, 100px) scale(1.3); }
}

/* Explore button movement */

    position: relative;
    overflow: hidden;
    transition: transform 0.35s ease,

    transform: scale(0.94);
}

    transition: transform 0.6s cubic-bezier(.2,.8,.2,1),

    transform: scale(1.08) rotate(3deg);
    filter: drop-shadow(0 20px 25px #102B4655);

/* ===== CRAVELY CINEMATIC WELCOME SCREEN ===== */

.welcome-screen {
    position: relative;
    overflow: hidden;
    isolation: isolate;

    background:
        radial-gradient(ellipse at 15% 20%, #FF684A55, transparent 35%),
        radial-gradient(ellipse at 85% 75%, #FFB86B44, transparent 35%),
        radial-gradient(ellipse at 50% 50%, #287A8666, transparent 65%),
        linear-gradient(135deg, #102638, #173D4B, #241D26);

    background-size: 200% 200%;
    animation: welcomeBackground 12s ease infinite;
}

@keyframes welcomeBackground {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}

/* Decorative glowing circles */
.welcome-screen::before {
    content: "";
    position: absolute;
    inset: -50%;
    z-index: 0;
    pointer-events: none;

    background:
        radial-gradient(circle at 25% 35%, #FF684A55 0, transparent 20%),
        radial-gradient(circle at 75% 65%, #FFD18A44 0, transparent 25%),
        radial-gradient(circle at 50% 50%, #FFFFFF12 0, transparent 40%);

    animation: welcomeGlow 9s ease-in-out infinite alternate;
}

@keyframes welcomeGlow {
    from { transform: rotate(0deg) scale(1); }
    to { transform: rotate(12deg) scale(1.15); }
}

/* Floating food decorations */
.welcome-screen::after {
    content: "🍕       🍔       🍟       🌮       🍩       🍗";
    position: absolute;
    top: 12%;
    left: -10%;
    width: 120%;
    font-size: clamp(25px, 4vw, 48px);
    letter-spacing: 35px;
    white-space: nowrap;
    opacity: 0.20;
    pointer-events: none;
    z-index: 0;

    animation: foodFloat 18s linear infinite;
}

@keyframes foodFloat {
    0% { transform: translateX(-5%) translateY(0) rotate(-5deg); }
    50% { transform: translateX(5%) translateY(35px) rotate(5deg); }
    100% { transform: translateX(-5%) translateY(0) rotate(-5deg); }
}

/* Keep welcome content above background */
.welcome-screen > * {
    position: relative;
    z-index: 2;
}

/* Cravely title */
.welcome-screen h1 {
    color: #FFD98E;
    text-shadow: 0 0 20px #FFB86B66;
    letter-spacing: 5px;
}

/* Welcome heading */
.welcome-screen h2 {
    text-shadow: 0 5px 25px #00000055;
}

/* Explore button */
.welcome-btn {
    position: relative;
    overflow: hidden;
    border: none;
    background: linear-gradient(120deg, #FF684A, #FFB86B, #FFE0A0);
    background-size: 200% 200%;
    color: #142B3D;
    font-weight: 800;
    box-shadow: 0 8px 35px #FF9A5B66;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
    animation: buttonGlow 3s ease-in-out infinite;
}

@keyframes buttonGlow {
    0%, 100% { box-shadow: 0 8px 25px #FF9A5B55; }
    50% { box-shadow: 0 8px 45px #FFD18A99; }
}

/* Shine movement */
.welcome-btn::before {
    content: "";
    position: absolute;

function startFoodOrbit() {
    if (document.getElementById("foodOrbit")) return;

    const orbit = document.createElement("div");

    orbit.className = "food-orbit";
    orbit.id = "foodOrbit";

    orbit.innerHTML = `
        <span>🍕</span>
        <span>🍔</span>
        <span>🍟</span>
        <span>🍩</span>
    `;

    document.body.appendChild(orbit);
}
function startCravelyEffects() {

    const hero = document.querySelector("#app .hero");

    if (!hero || hero.dataset.effectsAdded) return;

    hero.dataset.effectsAdded = "true";

    // Floating food items
    const foods = ["🍕", "🍔", "🍟", "🍩", "🍰", "🍜"];

    foods.forEach((emoji, index) => {

        const food = document.createElement("span");

        food.className = "cravely-floating-food";
        food.textContent = emoji;

        food.style.left = (68 + Math.random() * 25) + "%";
        food.style.top = (10 + Math.random() * 75) + "%";
        food.style.animationDelay = (index * 0.7) + "s";

        hero.appendChild(food);
    });

    // Floating particles
    for (let i = 0; i < 18; i++) {

        const particle = document.createElement("span");

        particle.className = "cravely-particle";

        particle.style.left = Math.random() * 100 + "%";
        particle.style.top = Math.random() * 100 + "%";
        particle.style.animationDelay = Math.random() * 6 + "s";

        hero.appendChild(particle);
    }
}
function startFoodDance() {

    if (document.getElementById("foodDanceLayer")) return;

    const layer = document.createElement("div");
    layer.id = "foodDanceLayer";

    const foods = [
        "🍗", "🍔", "🍕", "🍟",
        "🍩", "🌮", "🍿", "🥪",
        "🍖", "🍤", "🌭", "🍗"
    ];

    foods.forEach((emoji, i) => {

        const item = document.createElement("div");

        item.className = "food-dancer";
        item.textContent = emoji;

        item.style.left = Math.random() * 90 + "%";
        item.style.top = Math.random() * 90 + "%";

        item.style.animationDelay = (i * 0.4) + "s";
        item.style.animationDuration =
            (4 + Math.random() * 5) + "s";

        layer.appendChild(item);
    });

    document.body.appendChild(layer);
}
